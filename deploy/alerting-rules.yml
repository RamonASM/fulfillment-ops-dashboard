# =============================================================================
# Monitoring Commands
# =============================================================================
#
# Check PM2 process status:
#   pm2 list
#   pm2 monit
#
# View real-time logs:
#   pm2 logs inventory-api --lines 100
#
# Check metrics endpoint:
#   curl https://admin.yourtechassist.us/metrics
#   curl https://admin.yourtechassist.us/metrics?format=prometheus
#
# Memory usage:
#   pm2 show inventory-api | grep memory
#
# Restart counts:
#   pm2 show inventory-api | grep restart
